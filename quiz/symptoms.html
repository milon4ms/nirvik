        const root = document.getElementById('sections-root');
        const countLine = document.getElementById('countLine');
        const searchInput = document.getElementById('searchInput');
        let activeFilter = 'all';

        const sections = ["উপরের অঙ্গ", "মাঝের অঙ্গ", "নিচের অঙ্গ", "সার্বদেহিক রোগ ও সাধারণ"];
        const sectionIcons = {"উপরের অঙ্গ": "🧠", "মাঝের অঙ্গ": "🫁", "নিচের অঙ্গ": "🦵", "সার্বদেহিক রোগ ও সাধারণ": "🌡️"};

        function cardHTML(sym) {
            // লিংক: ফাইলের নাম অনুযায়ী — ক্রমিক নম্বর ছাড়া
            // play.html ফাইলটি base নাম দিয়ে JSON লোড করবে, যেমন: মল_ডায়রিয়া_ও_কোষ্ঠকাঠিন্য_Stool_Diarrhoea_and_Constipation.json
            const href = `play.html?type=sym&id=${encodeURIComponent(sym.base)}`;
            return `<a href="${href}" class="symptom-card" target="_blank" data-file="${sym.file}">
                <span class="symptom-bn">${sym.bn}</span>
                <span class="symptom-en">${sym.en}</span>
                <span class="q-count">${sym.count}টি প্রশ্ন</span>
            </a>`;
        }

        function render() {
            const q = (searchInput.value || "").trim().toLowerCase();
            let totalShown = 0;
            let html = '';
            sections.forEach(sec => {
                if (activeFilter !== 'all' && activeFilter !== sec) return;
                const list = symptomsList.filter(s => s.section === sec && (!q || s.bn.toLowerCase().includes(q) || s.en.toLowerCase().includes(q) || s.base.toLowerCase().includes(q)));
                if (list.length === 0) return;
                totalShown += list.length;
                html += `<div class="section-wrap"><div class="section-title"><span>${sectionIcons[sec]}</span> ${sec} <span class="badge">${list.length}টি ট্যাগ</span></div><div class="symptoms-container">${list.map(cardHTML).join('')}</div></div>`;
            });
            if (totalShown === 0) {
                html = `<div class="section-wrap"><div class="empty">কোনো ট্যাগ পাওয়া যায়নি। অন্য শব্দ দিয়ে খুঁজে দেখুন।</div></div>`;
            }
            root.innerHTML = html;
            const totalQ = symptomsList.reduce((a,s)=>a+s.count,0);
            countLine.innerHTML = `মোট <b>১০০টি</b> মেইন ট্যাগ &nbsp;•&nbsp; দেখানো হচ্ছে <b>${totalShown}টি</b> ট্যাগ &nbsp;•&nbsp; সব মিলিয়ে <b>${totalQ.toLocaleString('bn-BD')}টি</b> প্রশ্ন-এন্ট্রি (একই প্রশ্ন একাধিক ট্যাগে থাকতে পারে)`;
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.dataset.filter;
                render();
            });
        });
        searchInput.addEventListener('input', render);
        render();
    </script>
