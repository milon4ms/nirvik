<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>রোগলক্ষণ ভিত্তিক কুইজ</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        .header { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; max-width: 800px; margin: 0 auto; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-decoration: none; color: #333; transition: 0.2s; border-left: 5px solid #007bff; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .card h3 { margin: 0 0 10px 0; font-size: 1.2rem; }
        .card p { margin: 0; color: #777; font-size: 0.9rem; }
        .back-btn { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h2>🩺 রোগলক্ষণ ভিত্তিক কুইজ</h2>
        <a href="index.html" class="back-btn">← হোমে ফিরে যান</a>
    </div>
    
    <div class="list-grid" id="symptoms-list">
        <p>লোড হচ্ছে...</p>
    </div>

    <script type="module">
        async function loadSymptoms() {
            try {
                const res = await fetch('./data/symptoms/index.json');
                const data = await res.json();
                const container = document.getElementById('symptoms-list');
                container.innerHTML = ''; // ক্লিয়ার করা হলো

                data.forEach(sym => {
                    container.innerHTML += `
                        <a href="play.html?type=sym&id=${sym.id}" class="card">
                            <h3>${sym.name}</h3>
                            <p>প্রশ্ন সংখ্যা: ${sym.questionCount}</p>
                        </a>
                    `;
                });
            } catch (err) {
                document.getElementById('symptoms-list').innerHTML = '<p>ডেটা লোড করা যায়নি!</p>';
                console.error(err);
            }
        }
        loadSymptoms();
    </script>
</body>
</html>
