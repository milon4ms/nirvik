<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>ঔষধ ভিত্তিক কুইজ</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        .header { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; max-width: 800px; margin: 0 auto; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-decoration: none; color: #333; transition: 0.2s; border-left: 5px solid #28a745; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .card h3 { margin: 0 0 10px 0; font-size: 1.2rem; color: #007bff; }
        .card p { margin: 0; color: #777; font-size: 0.9rem; }
        .back-btn { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h2>💊 ঔষধ ভিত্তিক কুইজ</h2>
        <a href="index.html" class="back-btn">← হোমে ফিরে যান</a>
    </div>
    
    <div class="list-grid" id="medicines-list">
        <p>লোড হচ্ছে...</p>
    </div>

       <script type="module">
        import { getUserProgress } from './js/progress.js';
        import { checkAuthState } from './js/auth.js';

        async function loadMedicines() {
            try {
                const res = await fetch('./data/medicines/index.json');
                const data = await res.json();
                const container = document.getElementById('medicines-list');
                
                checkAuthState(async (user) => {
                    const progress = await getUserProgress();
                    container.innerHTML = ''; 

                    data.forEach(med => {
                        let resultHTML = '<p style="color: #999; font-size: 0.85rem; margin-top: 10px;">⚪ এখনো খেলা হয়নি</p>';
                        const quizId = `med:${med.id}`;
                        
                        if (progress[quizId]) {
                            const p = progress[quizId];
                            let color = p.lastPct >= 40 ? '#28a745' : '#dc3545';
                            resultHTML = `<p style="color: ${color}; font-weight: bold; margin-top: 10px; font-size: 0.9rem;">
                                🏆 সর্বশেষ: ${p.lastCorrect}/${p.total} (${p.lastPct}%)
                            </p>`;
                        }

                        container.innerHTML += `
                            <a href="play.html?type=med&id=${med.id}" class="card">
                                <h3>${med.name}</h3>
                                <p style="font-size: 0.9rem; margin-bottom: 5px;">${med.nameBn}</p>
                                ${resultHTML}
                            </a>
                        `;
                    });
                });
            } catch (err) {
                document.getElementById('medicines-list').innerHTML = '<p>ডেটা লোড করা যায়নি!</p>';
                console.error(err);
            }
        }
        loadMedicines();
    </script>
</body>
</html>
