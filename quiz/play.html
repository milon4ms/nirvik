<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কুইজ চলছে... - নির্ভীক হোমিও</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4361ee; --primary-hover: #3a0ca3; --bg-color: #f8f9fa; --card-bg: #ffffff; --text-main: #2b2d42; --text-muted: #6c757d; --shadow-sm: 0 4px 6px -1px rgba(0,0,0,0.05); --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.1); --radius: 12px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: var(--bg-color); background-image: radial-gradient(#e0e0e0 1px, transparent 1px); background-size: 20px 20px; color: var(--text-main); padding-bottom: 30px; }
        .main-header { background: #fff; box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 1000; margin-bottom: 30px; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 15px 20px; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 15px; }
        .nav-link { text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 1rem; padding: 8px 15px; border-radius: 8px; transition: all 0.3s ease; }
        .nav-link:hover { background: #eef2ff; color: var(--primary); }
        .nav-link.active { background: var(--primary); color: #fff; }
        .page-heading-area { text-align: center; max-width: 650px; margin: 0 auto 25px; padding: 0 20px; }
        .page-heading { color: var(--primary); font-size: 1.8rem; margin-bottom: 8px; font-weight: 700; line-height: 1.4; }
        .page-heading small { display: block; font-size: 1rem; color: var(--text-muted); font-weight: 500; margin-top: 4px; }
        .page-instruction { color: var(--text-muted); font-size: 1rem; line-height: 1.5; }
        .tag-meta { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .tag-pill { background: #eef2ff; color: var(--primary); font-size: .85rem; font-weight: 600; padding: 5px 12px; border-radius: 999px; }
        .tag-pill.muted { background: #f1f5f9; color: #475569; }
        .quiz-container-wrapper { max-width: 650px; margin: 0 auto; padding: 0 20px; }
        .container { background: var(--card-bg); padding: 30px; border-radius: var(--radius); box-shadow: var(--shadow-md); border: 1px solid #edf2f7; }
        .quiz-header { display: flex; justify-content: space-between; border-bottom: 2px solid #f1f3f5; padding-bottom: 15px; margin-bottom: 18px; font-weight: 700; color: var(--text-muted); font-size: 1.05rem; }
        .progress-wrap { height: 8px; background: #eef2ff; border-radius: 999px; overflow: hidden; margin-bottom: 22px; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width .3s; }
        .question-stem { font-size: 1.2rem; color: var(--text-main); margin-bottom: 25px; line-height: 1.6; font-weight: 600; }
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { padding: 15px 20px; font-size: 1rem; border: 2px solid #e2e8f0; border-radius: 10px; background: #fff; cursor: pointer; transition: all 0.2s ease; text-align: left; color: var(--text-main); font-weight: 500; display: flex; gap: 10px; align-items: center; }
        .option-btn:hover:not(:disabled) { background: #f0f4ff; border-color: var(--primary); color: var(--primary); }
        .option-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; font-weight: 700; }
        .option-btn.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option-letter { width: 28px; height: 28px; min-width: 28px; border-radius: 50%; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .9rem; }
        .option-btn.correct .option-letter { background: #28a745; color: #fff; }
        .option-btn.wrong .option-letter { background: #dc3545; color: #fff; }
        .feedback { margin-top: 25px; padding: 20px; border-radius: 10px; display: none; font-size: 1rem; line-height: 1.6; }
        .feedback.show { display: block; }
        .feedback.correct-box { background: #d4edda; border-left: 6px solid #28a745; color: #155724; }
        .feedback.wrong-box { background: #f8d7da; border-left: 6px solid #dc3545; color: #721c24; }
        .feedback b { display: block; margin-bottom: 6px; }
        .next-btn { margin-top: 25px; width: 100%; padding: 16px; background: var(--primary); color: white; font-size: 1.1rem; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; display: none; transition: 0.3s; }
        .next-btn:hover { background: var(--primary-hover); }
        .next-btn.show { display: block; }
        .result-card { text-align: center; padding: 10px 0; }
        .result-card h2 { color: var(--primary); margin-bottom: 20px; }
        .score-text { font-size: 3.5rem; font-weight: 700; margin: 15px 0; }
        .score-sub { color: var(--text-muted); margin-bottom: 18px; }
        .btn { padding: 12px 25px; text-decoration: none; border-radius: 8px; color: white; display: inline-block; margin: 10px 5px; font-weight: 600; transition: 0.3s; }
        .btn-gray { background: #6c757d; }
        .btn-gray:hover { background: #5a6268; }
        .btn-blue { background: var(--primary); border: none; cursor: pointer; font-size: 1rem; }
        .btn-blue:hover { background: var(--primary-hover); }
        .login-note { text-align: center; margin-top: 25px; font-size: 0.85rem; color: #856404; background: #fff3cd; padding: 10px 15px; border-radius: 8px; border: 1px solid #ffeeba; display: inline-block; width: 100%; }
        .login-note i { margin-right: 5px; }
        .error-box { text-align: center; padding: 20px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 10px; color: #856404; line-height: 1.6; }
        .error-box a { color: var(--primary); font-weight: 700; }
        .debug { font-size: .8rem; color: #94a3b8; margin-top: 12px; word-break: break-all; text-align: left; background: #f8fafc; padding: 10px; border-radius: 8px; }
        @media (max-width: 768px) {
            .nav-container { flex-direction: column; gap: 8px; padding: 10px; }
            .nav-link { width: 100%; text-align: center; padding: 6px 10px; font-size: 0.95rem; }
            .container { padding: 20px; }
            .question-stem { font-size: 1.1rem; }
            .score-text { font-size: 2.8rem; }
            .page-heading { font-size: 1.5rem; }
            .page-instruction { font-size: 0.9rem; }
        }
    </style>
</head>

            } catch (e) { lastErr = url + ' → ' + e.message; }
        }
        container.innerHTML = '<div class="error-box">এই ' + (type === 'med' ? 'ঔষধের' : 'ট্যাগের') + ' প্রশ্ন ফাইল পাওয়া যায়নি।<br>খুঁজছিলাম: <b>' + id + '.json</b><br><br><a href="' + backHref + '">' + backLabel + '</a><div class="debug">চেষ্টা করা লোকেশন:<br>' + tried.join('<br>') + '<br><br>শেষ এরর: ' + lastErr + '<br><br>আপনার সার্ভারে এই ফাইলটা কোন ফোল্ডারে আছে সেটা দেখে নিন — যেমন quiz/medicines/calcarea-fluor.json হলে এই পেজ নিজেই খুঁজে পাবে।</div></div>';
    }
    function renderQuestion() {
        const q = questions[order[current]];
        const opts = shuffle(q.options.map((o) => ({ ...o })));
        const letters = ['ক', 'খ', 'গ', 'ঘ'];
        container.innerHTML = '<div class="quiz-header"><span>প্রশ্ন ' + (current + 1) + ' / ' + questions.length + '</span><span>স্কোর: ' + score + '</span></div><div class="progress-wrap"><div class="progress-bar" style="width:' + (current / questions.length * 100) + '%"></div></div><div class="question-stem">' + q.stem + '</div><div class="options-grid">' + opts.map((o, i) => '<button class="option-btn" data-mid="' + o.mid + '"><span class="option-letter">' + (letters[i] || (i+1)) + '</span><span>' + o.text + '</span></button>').join('') + '</div><div class="feedback" id="feedback"></div><button class="next-btn" id="nextBtn">' + (current + 1 === questions.length ? 'ফলাফল দেখুন →' : 'পরের প্রশ্ন →') + '</button>';
        const feedback = document.getElementById('feedback');
        const nextBtn = document.getElementById('nextBtn');
        container.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const chosen = btn.dataset.mid;
                const isCorrect = chosen === q.answer;
                container.querySelectorAll('.option-btn').forEach(b => {
                    b.disabled = true;
                    if (b.dataset.mid === q.answer) b.classList.add('correct');
                    else if (b === btn) b.classList.add('wrong');
                });
                if (isCorrect) {
                    score++;
                    feedback.className = 'feedback show correct-box';
                    feedback.innerHTML = '<b>✅ সঠিক উত্তর!</b>' + (q.explanation ? q.explanation : '');
                } else {
                    const correctText = (q.options.find(o => o.mid === q.answer) || {}).text || q.answer;
                    feedback.className = 'feedback show wrong-box';
                    feedback.innerHTML = '<b>❌ ভুল উত্তর। সঠিক উত্তর: ' + correctText + '</b>' + (q.explanation ? q.explanation : '');
                }
                document.querySelector('.quiz-header').innerHTML = '<span>প্রশ্ন ' + (current + 1) + ' / ' + questions.length + '</span><span>স্কোর: ' + score + '</span>';
                nextBtn.classList.add('show');
            });
        });
        nextBtn.addEventListener('click', () => {
            if (current + 1 < questions.length) { current++; renderQuestion(); }
            else { showResult(); }
        });
    }
    function showResult() {
        const total = questions.length;
        const pct = total ? Math.round((score / total) * 100) : 0;
        let msg = pct >= 80 ? 'অসাধারণ! 🎉' : pct >= 50 ? 'ভালো হয়েছে! 👍' : 'আরেকবার চেষ্টা করুন 💪';
        container.innerHTML = '<div class="result-card"><h2>কুইজ শেষ!</h2><p style="color:var(--text-muted)">' + info.bn + (info.en ? ' (' + info.en + ')' : '') + '</p><div class="score-text">' + score + ' / ' + total + '</div><p class="score-sub">' + pct + '% — ' + msg + '</p><button class="btn btn-blue" id="retryBtn">🔄 আবার দিন</button><a class="btn btn-gray" href="' + backHref + '">← তালিকায় ফিরুন</a></div>';
        document.getElementById('retryBtn').addEventListener('click', () => {
            order = shuffle(questions.map((_, i) => i)); current = 0; score = 0; renderQuestion();
        });
    }
    loadQuestions();
</script>
</body>
</html>
