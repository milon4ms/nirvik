<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কুইজ চলছে... - নির্ভীক হোমিও</title>
    
    <!-- গুগল ফন্ট এবং আইকন -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4361ee;
            --primary-hover: #3a0ca3;
            --secondary: #4cc9f0;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2b2d42;
            --text-muted: #6c757d;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            padding-bottom: 30px;
        }

        /* কমন হেডার নেভিগেশন */
        .main-header {
            background: #fff;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 1000;
            margin-bottom: 30px;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 1rem;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: #eef2ff;
            color: var(--primary);
        }

        .nav-link.active {
            background: var(--primary);
            color: #fff;
        }

        /* 🟢 নতুন হেডিং এবং নির্দেশনা */
        .page-heading-area {
            text-align: center;
            max-width: 650px;
            margin: 0 auto 25px;
            padding: 0 20px;
        }

        .page-heading {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .page-instruction {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.5;
        }

        /* কুইজ মেইন কন্টেইনার */
        .quiz-container-wrapper {
            max-width: 650px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid #edf2f7;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #f1f3f5;
            padding-bottom: 15px;
            margin-bottom: 25px;
            font-weight: 700;
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .question-stem {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 25px;
            line-height: 1.6;
            font-weight: 600;
        }

        .options-grid { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .option-btn { 
            padding: 15px 20px; 
            font-size: 1rem; 
            border: 2px solid #e2e8f0; 
            border-radius: 10px; 
            background: #fff; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            text-align: left; 
            color: var(--text-main); 
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) { 
            background: #f0f4ff; 
            border-color: var(--primary); 
            color: var(--primary);
        }

        .option-btn.correct { 
            background: #d4edda; 
            border-color: #28a745; 
            color: #155724; 
            font-weight: 700;
        }

        .option-btn.wrong { 
            background: #f8d7da; 
            border-color: #dc3545; 
            color: #721c24; 
        }

        .feedback { 
            margin-top: 25px; 
            padding: 20px; 
            border-radius: 10px; 
            display: none; 
            font-size: 1rem;
            line-height: 1.5;
        }

        .feedback.show { 
            display: block; 
        }

        .feedback.correct-box { 
            background: #d4edda; 
            border-left: 6px solid #28a745; 
            color: #155724;
        }

        .feedback.wrong-box { 
            background: #f8d7da; 
            border-left: 6px solid #dc3545; 
            color: #721c24;
        }

        .next-btn { 
            margin-top: 25px; 
            width: 100%; 
            padding: 16px; 
            background: var(--primary); 
            color: white; 
            font-size: 1.1rem; 
            font-weight: 600;
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            display: none; 
            transition: 0.3s;
        }

        .next-btn:hover {
            background: var(--primary-hover);
        }

        .next-btn.show { 
            display: block; 
        }

        /* রেজাল্ট কার্ড */
        .result-card { 
            text-align: center; 
            padding: 10px 0; 
        }

        .result-card h2 {
            color: var(--primary);
            margin-bottom: 20px;
        }

        .score-text { 
            font-size: 3.5rem; 
            font-weight: 700;
            margin: 15px 0; 
        }

        .btn { 
            padding: 12px 25px; 
            text-decoration: none; 
            border-radius: 8px; 
            color: white; 
            display: inline-block; 
            margin: 10px; 
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-gray { background: #6c757d; }
        .btn-gray:hover { background: #5a6268; }
        .btn-blue { background: var(--primary); border: none; cursor: pointer; font-size: 1rem;}
        .btn-blue:hover { background: var(--primary-hover); }

        /* 🟢 নিচের লগইন নোটিশ */
        .login-note {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            color: #856404;
            background: #fff3cd;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #ffeeba;
            display: inline-block;
            width: 100%;
        }

        .login-note i {
            margin-right: 5px;
        }

        /* মোবাইল রেসপন্সিভ */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 8px;
                padding: 10px;
            }
            .nav-link {
                width: 100%;
                text-align: center;
                padding: 6px 10px;
                font-size: 0.95rem;
            }
            .container {
                padding: 20px;
            }
            .question-stem { font-size: 1.1rem; }
            .score-text { font-size: 2.8rem; }
            .page-heading { font-size: 1.5rem; }
            .page-instruction { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <!-- কমন হেডার মেনু -->
    <header class="main-header">
        <div class="nav-container">
            <a href="https://nirvik.mooo.com/" class="nav-link">নির্ভীক হোমিও</a>
            <a href="https://nirvik.mooo.com/quiz/index.html" class="nav-link">কুইজ</a>
            <a href="https://nirvik.mooo.com/quiz/symptoms.html" class="nav-link">রোগলক্ষণ ভিত্তিক কুইজ</a>
            <a href="https://nirvik.mooo.com/quiz/medicines.html" class="nav-link active">ঔষধ ভিত্তিক কুইজ</a>
            <a href="https://nirvik.mooo.com/medica/index.html" class="nav-link">মেটেরিয়া মেডিকা</a>
        </div>
    </header>

    <!-- 🟢 নতুন হেডিং এবং নির্দেশনা -->
    <div class="page-heading-area">
        <h2 class="page-heading">📝 কুইজ অনুশীলন</h2>
        <p class="page-instruction">নিচের প্রশ্নটির সঠিক উত্তর এর উপর ক্লিক করুন। প্রতিটি সঠিক উত্তরের জন্য ১ নম্বর প্রদান করা হবে।</p>
    </div>

    <!-- কুইজ কন্টেইনার -->
    <div class="quiz-container-wrapper">
        <div class="container" id="quiz-container">
            <!-- জাভাস্ক্রিপ্ট দিয়ে এখানে প্রশ্ন লোড হবে -->
            <div style="text-align: center; padding: 40px; color: var(--text-muted);">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 15px;"></i><br>
                প্রশ্ন লোড হচ্ছে...
            </div>
        </div>

        <!-- 🟢 লগইন নোটিশ (সবার নিচে) -->
        <div class="login-note">
            <i class="fa-solid fa-circle-info"></i> কুইজের রেকর্ড সংরক্ষণ ও সার্টিফিকেট পেতে চাইলে লগইন করতে হবে।
        </div>
    </div>

    <!-- কুইজ ইঞ্জিন স্ক্রিপ্ট -->
    <script type="module" src="js/quiz-engine.js"></script>
</body>
</html>
