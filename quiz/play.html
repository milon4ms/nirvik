    const params = new URLSearchParams(location.search);

    function prettyMed(idStr) {

    } else {
        pageHeading.innerHTML = '📝 কুইজ অনুশীলন<small>কোনো ট্যাগ বেছে নেওয়া হয়নি</small>';
        container.innerHTML = '<div class="error-box">কোনো কুইজ বেছে নেওয়া হয়নি।</div>';

    let questions = [];
    let order = [];

    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
        return a;
    }
    function capitalizeFirst(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
    function buildCandidates() {
        const enc = encodeURIComponent(id);
        const cap = id.split('-').map(capitalizeFirst).join('-');
        const capUnd = id.split('-').map(capitalizeFirst).join('_');

        if (type === 'med') {
            // ঔষধ ফাইলগুলো সাধারণত medicines/ ফোল্ডারে থাকে — আগের ভার্সনে শুধু একই ফোল্ডারে খোঁজা হয়েছিল বলেই ভেঙেছিল
            cands.push(

            cands.push(

                'quiz-data/' + enc + '.json',
                'symptoms/' + enc + '.json',
                'data/symptoms/' + enc + '.json'
            );
        }
        return [...new Set(cands)];
    }
    function normalizeQuestions(raw, wantedId) {
        let arr = null;
        if (Array.isArray(raw)) arr = raw;
        else if (raw && typeof raw === 'object') {
            if (Array.isArray(raw.questions)) arr = raw.questions;
            else if (Array.isArray(raw.quiz)) arr = raw.quiz;
            else if (Array.isArray(raw.data)) arr = raw.data;
            else if (Array.isArray(raw.items)) arr = raw.items;
            else {
                const keys = Object.keys(raw);
                const matchKey = keys.find(k => k.toLowerCase() === wantedId.toLowerCase());
                if (matchKey) return normalizeQuestions(raw[matchKey], wantedId);
                // একটাই বড় ফাইলে সব ঔষধ থাকলে — যেমন medicines.json = { "calcarea-fluor": [...] }
                for (const k of keys) {
                    if (Array.isArray(raw[k]) && raw[k].length && raw[k][0] && (raw[k][0].stem || raw[k][0].question)) { arr = raw[k]; break; }
                }
                if (!arr && keys.length && raw[keys[0]] && typeof raw[keys[0]] === 'object') {
                    // { "calcarea-fluor": { questions: [...] } } ধরনের
                    for (const k of keys) { const v = raw[k]; if (v && Array.isArray(v.questions)) { arr = v.questions; break; } }
                }
            }
        }
        if (!Array.isArray(arr)) return null;
        return arr.map((q, qi) => {
            const stem = q.stem || q.question || q.q || q.text || q.title || ('প্রশ্ন ' + (qi + 1));
            let rawOpts = q.options || q.choices || q.answers || q.opts || [];
            let opts = [];
            if (Array.isArray(rawOpts)) {
                opts = rawOpts.map((o, oi) => {
                    if (typeof o === 'string') return { mid: 'opt' + oi, text: o };
                    return { mid: String(o.mid || o.id || o.value || o.key || ('opt' + oi)), text: o.text || o.option || o.value || o.label || o.answer || String(o) };
                });
            }
            let ans = q.answer ?? q.correct ?? q.correctAnswer ?? q.answerMid ?? q.correctMid ?? q.correctOption;
            let ansMid = null;
            if (ans !== undefined && ans !== null) {
                if (typeof ans === 'number') ansMid = opts[ans] ? opts[ans].mid : null;
                else if (typeof ans === 'string') {
                    const s = ans.trim();
                    if (opts.find(o => o.mid === s)) ansMid = s;
                    else if (/^[A-Da-d]$/.test(s)) { const idx = 'ABCDabcd'.indexOf(s) % 4; ansMid = opts[idx] ? opts[idx].mid : null; }
                    else if (/^[0-3]$/.test(s)) ansMid = opts[parseInt(s)] ? opts[parseInt(s)].mid : null;
                    else { const byText = opts.find(o => o.text.trim() === s); ansMid = byText ? byText.mid : s; }
                }
            }
            if (!ansMid && opts.length) ansMid = opts[0].mid;
            return { stem: stem, options: opts, answer: ansMid, explanation: q.explanation || q.explain || q.reason || q.desc || '' };
        }).filter(q => q.options.length > 0);
    }
    async function loadQuestions() {
        if (!id) return;
        const candidates = buildCandidates();
        let lastErr = '';
        let tried = [];
        for (const url of candidates) {
            tried.push(url);
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const raw = await res.json();
                    const norm = normalizeQuestions(raw, id);
                    if (norm && norm.length) { questions = norm; order = shuffle(questions.map((_, i) => i)); current = 0; score = 0; renderQuestion(); return; }
                    lastErr = url + ' → ফরম্যাট চিনতে পারিনি';
                } else { lastErr = url + ' → ' + res.status; }
            } catch (e) { lastErr = url + ' → ' + e.message; }
        }
        container.innerHTML = '<div class="error-box">এই ' + (type === 'med' ? 'ঔষধের' : 'ট্যাগের') + ' প্রশ্ন ফাইল পাওয়া যায়নি।<br>খুঁজছিলাম: <b>' + id + '.json</b><div class="debug">চেষ্টা করা লোকেশন:<br>' + tried.join('<br>') + '<br><br>শেষ এরর: ' + lastErr + '<br><br>আপনার সার্ভারে এই ফাইলটা কোন ফোল্ডারে আছে সেটা দেখে নিন — যেমন quiz/medicines/calcarea-fluor.json হলে এই পেজ নিজেই খুঁজে পাবে।</div></div>';
    }
    function renderQuestion() {
        const q = questions[order[current]];
        const opts = shuffle(q.options.map((o) => ({ ...o })));
        const letters = ['ক', 'খ', 'গ', 'ঘ'];
        container.innerHTML = '<div class="quiz-header"><span>প্রশ্ন ' + (current + 1) + ' / ' + questions.length + '</span><span>স্কোর: ' + score + '</span></div><div class="progress-wrap"><div class="progress-bar" style="width:' + (current / questions.length * 100) + '%"></div></div><div class="question-stem">' + q.stem + '</div><div class="options-grid">' + opts.map((o, i) => '<button class="option-btn" data-mid="' + o.mid + '"><span class="option-letter">' + (letters[i] || (i+1)) + '</span><span>' + o.text + '</span></button>').join('') + '</div><div class="feedback" id="feedback"></div><button class="next-btn" id="nextBtn">' + (current + 1 === questions.length ? 'ফলাফল দেখুন →' : 'পরের প্রশ্ন →') + '</button>';
        const feedback = document.getElementById('feedback');
        const nextBtn = document.getElementById('nextBtn');
        container.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const chosen = btn.dataset.mid;
                const isCorrect = chosen === q.answer;
                container.querySelectorAll('.option-btn').forEach(b => {
                    b.disabled = true;
                    if (b.dataset.mid === q.answer) b.classList.add('correct');
                    else if (b === btn) b.classList.add('wrong');
                });
                if (isCorrect) {
                    score++;
                    feedback.className = 'feedback show correct-box';
                    feedback.innerHTML = '<b>✅ সঠিক উত্তর!</b>' + (q.explanation ? q.explanation : '');
                } else {
                    const correctText = (q.options.find(o => o.mid === q.answer) || {}).text || q.answer;
                    feedback.className = 'feedback show wrong-box';
                    feedback.innerHTML = '<b>❌ ভুল উত্তর। সঠিক উত্তর: ' + correctText + '</b>' + (q.explanation ? q.explanation : '');
                }
                document.querySelector('.quiz-header').innerHTML = '<span>প্রশ্ন ' + (current + 1) + ' / ' + questions.length + '</span><span>স্কোর: ' + score + '</span>';
                nextBtn.classList.add('show');
            });
        });
        nextBtn.addEventListener('click', () => {
            if (current + 1 < questions.length) { current++; renderQuestion(); }
            else { showResult(); }
        });
    }
    function showResult() {
        const total = questions.length;
        const pct = total ? Math.round((score / total) * 100) : 0;
        let msg = pct >= 80 ? 'অসাধারণ! 🎉' : pct >= 50 ? 'ভালো হয়েছে! 👍' : 'আরেকবার চেষ্টা করুন 💪';
        container.innerHTML = '<div class="result-card"><h2>কুইজ শেষ!</h2><p style="color:var(--text-muted)">' + info.bn + (info.en ? ' (' + info.en + ')' : '') + '</p><div class="score-text">' + score + ' / ' + total + '</div><p class="score-sub">' + pct + '% — ' + msg + '</p><button class="btn btn-blue" id="retryBtn">🔄 আবার দিন</button></div>';
        document.getElementById('retryBtn').addEventListener('click', () => {
            order = shuffle(questions.map((_, i) => i)); current = 0; score = 0; renderQuestion();
        });
    }
