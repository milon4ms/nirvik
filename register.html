<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রেজিস্ট্রেশন - নির্ভীক হোমিও</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
    
    <script src="assets/js/firebase-config.js"></script>

    <style>
        body { 
            font-family: 'SolaimanLipi', system-ui, sans-serif; 
            background-color: #f0fdf4; 
        }
        
        /* হেডার ও মেনুর কালার সমস্যা সমাধানের ফিক্স */
        #header-placeholder, nav {
            background-color: #065f46 !important; /* ডার্ক গ্রিন ব্যাকগ্রাউন্ড */
        }
        #header-placeholder a, #header-placeholder button, nav a {
            color: #ffffff !important; /* টেক্সট কালার সাদা */
            opacity: 1 !important;
        }
        #header-placeholder a:hover, nav a:hover {
            color: #a7f3d0 !important; /* হোভার কালার */
        }

        /* ইনপুট ফিল্ড ও বাটনের আধুনিক ডিজাইন ফিক্স */
        .input-group i {
            transition: color 0.2s;
        }
        .input-field:focus + i {
            color: #059669;
        }
        .error-msg { color: #e53e3e; font-size: 14px; margin-top: 5px; }
        .success-msg { color: #38a169; font-size: 14px; margin-top: 5px; display: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div id="header-placeholder"></div>

    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-6 bg-white p-8 sm:p-10 rounded-2xl shadow-xl border border-emerald-100/50">
            
            <div class="flex items-center justify-center gap-4 border-b border-gray-100 pb-4">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 text-2xl shadow-sm border border-emerald-100 animate-bounce flex-shrink-0">
                    🌿
                </div>
                <div class="text-left">
                    <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight leading-none">নতুন একাউন্ট</h2>
                    <p class="mt-1.5 text-xs text-gray-500">নির্ভীক হোমিওতে আপনাকে স্বাগতম</p>
                </div>
            </div>

            <form class="mt-4 space-y-5" id="registerForm">
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">👤 নাম</label>
                    <div class="relative input-group">
                        <input type="text" id="displayName" placeholder="আপনার নাম লিখুন" required
                            class="input-field w-full pl-4 pr-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all duration-200 text-base">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">📞 ফোন নাম্বার</label>
                    <div class="relative input-group">
                        <input type="text" id="phone" placeholder="01XXXXXXXXX (১১ ডিজিট)" required
                            class="input-field w-full pl-4 pr-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all duration-200 text-base">
                    </div>
                    <div id="phoneError" class="error-msg mt-1.5 hidden items-center gap-1.5 bg-red-50 text-red-600 px-3 py-1.5 rounded-lg border border-red-100">
                        <span>❌ ফোন নাম্বারটি অবশ্যই ১১ ডিজিটের এবং ০১ দিয়ে শুরু হতে হবে!</span>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">📧 ইমেইল ঠিকানা</label>
                    <div class="relative input-group">
                        <input type="email" id="email" placeholder="আপনার আসল ইমেইল ঠিকানা দিন" required
                            class="input-field w-full pl-4 pr-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all duration-200 text-base">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">🔒 পাসওয়ার্ড</label>
                    <div class="relative input-group">
                        <input type="password" id="password" placeholder="কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড" required minlength="6"
                            class="input-field w-full pl-4 pr-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all duration-200 text-base">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">🔒 পাসওয়ার্ড নিশ্চিত করুন</label>
                    <div class="relative input-group">
                        <input type="password" id="confirmPassword" placeholder="আবার পাসওয়ার্ডটি লিখুন" required
                            class="input-field w-full pl-4 pr-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all duration-200 text-base">
                    </div>
                    <div id="passwordError" class="error-msg mt-1.5 hidden items-center gap-1.5 bg-red-50 text-red-600 px-3 py-1.5 rounded-lg border border-red-100">
                        <span>❌ পাসওয়ার্ড দুটি মিলছে না!</span>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" id="registerBtn"
                        class="w-full flex justify-center items-center py-3.5 px-4 border border-transparent rounded-xl text-base font-bold text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-4 focus:ring-emerald-100 transition-all duration-200 shadow-md hover:shadow-lg transform hover:-translate-y-0.5 disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none">
                        <i class="fas fa-user-plus mr-2"></i> একাউন্ট তৈরি করুন
                    </button>
                </div>

                <div class="text-center mt-4">
                    <p class="text-sm text-gray-600">
                        ইতিমধ্যে একাউন্ট আছে? 
                        <a href="login.html" class="font-bold text-emerald-600 hover:text-emerald-700 ml-1 transition-colors duration-200 underline underline-offset-4">লগইন করুন</a>
                    </p>
                </div>
            </form>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        // ===== হেডার/ফুটার লোড ও স্টাইল ইনজেকশন =====
        $(function() {
            $('#header-placeholder').load('assets/header.html', function() {
                $('#header-placeholder').find('nav, div.bg-white, div.bg-emerald-600').css('background-color', '#065f46');
                $('#header-placeholder').find('a, button, span').css('color', '#ffffff');

                const btn = document.getElementById('mobile-menu-btn');
                const menu = document.getElementById('mobile-menu');
                if (btn && menu) {
                    btn.addEventListener('click', function() {
                        menu.classList.toggle('hidden');
                        btn.innerHTML = menu.classList.contains('hidden') 
                            ? '<i class="fas fa-bars"></i>' 
                            : '<i class="fas fa-times"></i>';
                    });
                }
            });
            $('#footer-placeholder').load('assets/footer.html');
        });

        // ===== বাংলা সংখ্যাকে ইংরেজিতে রূপান্তরের হেল্পার ফাংশন =====
        function convertBanglaToEnglish(str) {
            const banglaDigits = {'০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9'};
            return str.replace(/[০-৯]/g, function(w) { return banglaDigits[w]; });
        }

        // ===== রেজিস্ট্রেশন ফাংশন =====
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('displayName').value.trim() || 'ইউজার';
            let phone = document.getElementById('phone').value.trim();
            let email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('registerBtn');

            // হাইড এরর মেসেজ রিসেট (hidden ক্লাস দিয়ে হ্যান্ডেল করা হয়েছে)
            document.getElementById('phoneError').classList.add('hidden');
            document.getElementById('phoneError').classList.remove('flex');
            document.getElementById('passwordError').classList.add('hidden');
            document.getElementById('passwordError').classList.remove('flex');

            // ১. ফোন নাম্বার ফরমেট ভ্যালিডেশন
            phone = convertBanglaToEnglish(phone);
            const phonePattern = /^01[0-9]{9}$/;
            if (!phonePattern.test(phone)) {
                document.getElementById('phoneError').classList.remove('hidden');
                document.getElementById('phoneError').classList.add('flex');
                document.getElementById('phone').focus();
                return;
            }

            // ২. পাসওয়ার্ড মিল চেক
            if (password !== confirm) {
                document.getElementById('passwordError').classList.remove('hidden');
                document.getElementById('passwordError').classList.add('flex');
                document.getElementById('confirmPassword').focus();
                return;
            }

            // বাটন ডিজেবল ও লোডিং স্টেট
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> প্রক্রিয়াকরণ...';

            try {
                const db = firebase.firestore();

                // ৩. এই ফোন নাম্বার দিয়ে ইতিমধ্যে ডাটাবেজে অন্য কোনো একাউন্ট আছে কিনা যাচাই
                const phoneCheckSnapshot = await db.collection('users').where('phone', '==', phone).get();
                if (!phoneCheckSnapshot.empty) {
                    alert('❌ এই ফোন নাম্বারটি দিয়ে ইতিমধ্যে একটি একাউন্ট তৈরি করা হয়েছে!');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus mr-2"></i> একাউন্ট তৈরি করুন';
                    return;
                }

                // ৪. Firebase Auth-এ আসল ইমেইল এবং পাসওয়ার্ড দিয়ে ইউজার তৈরি
                const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // প্রোফাইল আপডেট (ডিসপ্লে নেম)
                await user.updateProfile({ displayName: name });

                // ৫. Firestore-এ তথ্য সংরক্ষণ
                await db.collection('users').doc(user.uid).set({
                    uid: user.uid,
                    email: email,
                    name: name,
                    phone: phone, 
                    role: 'general',
                    isPaid: false,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    emailVerified: user.emailVerified
                });

                alert('✅ রেজিস্ট্রেশন সফল হয়েছে! অনুগ্রহ করে লগইন করুন।');
                window.location.href = 'login.html';

            } catch (error) {
                console.error("Registration error:", error);
                let msg = error.message;
                if(error.code === 'auth/email-already-in-use') {
                    msg = "এই ইমেইল ঠিকানাটি দিয়ে ইতিমধ্যে একাউন্ট খোলা হয়েছে।";
                }
                alert('❌ ' + msg);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus mr-2"></i> একাউন্ট তৈরি করুন';
            }
        });
    </script>

</body>
</html>
