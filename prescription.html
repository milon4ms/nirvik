<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রেসক্রিপশন এন্ট্রি - নির্ভীক হোমিও</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
    
    <script src="assets/js/firebase-config.js"></script>

    <style>
        body { 
            font-family: 'SolaimanLipi', system-ui, sans-serif; 
            background-color: #f0fdf4; 
        }
        #header-placeholder, nav { background-color: #065f46 !important; }
        #header-placeholder a, #header-placeholder button, nav a { color: #ffffff !important; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div id="header-placeholder"></div>

    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-2xl w-full space-y-6 bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-emerald-100/50">
            
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-gray-100 pb-4">
                <div class="flex items-center gap-3">
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 text-2xl border border-emerald-100">
                        📄
                    </div>
                    <div>
                        <h2 class="text-xl font-extrabold text-gray-900">প্রেসক্রিপশন এন্ট্রি</h2>
                        <p class="text-xs text-gray-500">আপনার আজকের প্রেসক্রিপশনটি এখানে লিখুন বা পেস্ট করুন</p>
                    </div>
                </div>
                <div class="bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-2 text-center sm:text-right">
                    <span class="text-xs text-emerald-800 block font-semibold">আজকের কোটা ব্যবহার</span>
                    <span id="quotaText" class="text-lg font-bold text-emerald-700">লোড হচ্ছে...</span>
                </div>
            </div>

            <form id="prescriptionForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">✍️ প্রেসক্রিপশন টেক্সট</label>
                    <textarea id="prescriptionText" rows="10" required placeholder="এখানে প্রেসক্রিপশন টাইপ করুন বা পেস্ট করুন..."
                        class="w-full p-4 bg-gray-50 border-2 border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all duration-200 text-base disabled:bg-gray-200 disabled:cursor-not-allowed"></textarea>
                </div>

                <div>
                    <button type="submit" id="submitBtn" disabled
                        class="w-full flex justify-center items-center py-3.5 px-4 border border-transparent rounded-xl text-base font-bold text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-4 focus:ring-emerald-100 transition-all duration-200 shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-paper-plane mr-2"></i> সাবমিট করুন
                    </button>
                </div>
            </form>
            
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        // হেডার/ফুটার লোড
        $(function() {
            $('#header-placeholder').load('assets/header.html');
            $('#footer-placeholder').load('assets/footer.html');
        });

        const db = firebase.firestore();
        let currentUser = null;
        let userRole = "general";
        let maxQuota = 5;

        // আজকের তারিখের শুরু (রাত ১২:০০) এবং শেষ (রাত ১১:৫৯) সময় বের করার ফাংশন
        function getTodayRange() {
            const start = new Date();
            start.setHours(0, 0, 0, 0);

            const end = new Date();
            end.setHours(23, 59, 59, 999);

            return { start, end };
        }

        // ইউজারের লগইন স্টেট এবং কোটা চেক করা
        firebase.auth().onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                try {
                    // ১. ইউজারের প্রোফাইল থেকে Role চেক করা
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        userRole = userDoc.data().role || "general";
                    }

                    // রোল অনুযায়ী সর্বোচ্চ লিমিট সেট
                    maxQuota = (userRole === "paid") ? 50 : 5;
                    
                    // ২. আজকের সাবমিট করা প্রেসক্রিপশন সংখ্যা গণনা করা
                    checkTodayQuota();

                } catch (error) {
                    console.error("Error fetching user data:", error);
                    alert("ডাটাবেজ লোড করতে সমস্যা হয়েছে।");
                }
            } else {
                // রেজিস্টার্ড ইউজার না হলে লগইন পেজে রিডাইরেক্ট
                alert("এই পেজে প্রবেশ করতে প্রথমে লগইন করুন।");
                window.location.href = "login.html";
            }
        });

        // আজকের কোটা যাচাই ও UI লক/আনলক করার মেইন ফাংশন
        async function checkTodayQuota() {
            if (!currentUser) return;

            const { start, end } = getTodayRange();

            try {
                // ফায়ারস্টোর থেকে আজকের ডেট রেঞ্জের প্রেসক্রিপশন কুয়েরি
                const snapshot = await db.collection('prescriptions')
                    .where('uid', '==', currentUser.uid)
                    .where('createdAt', '>=', start)
                    .where('createdAt', '<=', end)
                    .get();

                const submittedCount = snapshot.size; // আজকে কয়টা জমা দিয়েছে

                // UI-তে কোটা টেক্সট আপডেট (যেমন: ২ / ৫)
                document.getElementById('quotaText').innerText = `${submittedCount} / ${maxQuota}`;

                // ৩. কোটা শেষ হলে লক করার লজিক
                if (submittedCount >= maxQuota) {
                    document.getElementById('prescriptionText').disabled = true;
                    document.getElementById('prescriptionText').placeholder = `❌ দুঃখিত! আপনার আজকের দৈনিক কোটা (${maxQuota}টি) শেষ হয়ে গেছে। আগামীকাল আবার চেষ্টা করুন।`;
                    document.getElementById('submitBtn').disabled = true;
                    document.getElementById('submitBtn').innerText = "আজকের কোটা শেষ";
                } else {
                    document.getElementById('prescriptionText').disabled = false;
                    document.getElementById('submitBtn').disabled = false;
                    document.getElementById('submitBtn').innerHTML = '<i class="fas fa-paper-plane mr-2"></i> সাবমিট করুন';
                }

            } catch (error) {
                console.error("Quota check error:", error);
            }
        }

        // ফর্ম সাবমিট হ্যান্ডলার
        document.getElementById('prescriptionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!currentUser) return;
            
            const text = document.getElementById('prescriptionText').value.trim();
            const btn = document.getElementById('submitBtn');

            if (!text) {
                alert("অনুগ্রহ করে কিছু লিখুন!");
                return;
            }

            // সাবমিট করার আগেও আরেকবার সিকিউরিটি চেক
            btn.disabled = true;
            btn.innerText = "যাচাই করা হচ্ছে...";

            const { start, end } = getTodayRange();
            const snapshot = await db.collection('prescriptions')
                .where('uid', '==', currentUser.uid)
                .where('createdAt', '>=', start)
                .where('createdAt', '<=', end)
                .get();

            if (snapshot.size >= maxQuota) {
                alert(`❌ আপনার আজকের কোটা (${maxQuota}টি) ইতিমধ্যে শেষ!`);
                checkTodayQuota();
                return;
            }

            // ৪. ডাটাবেজে প্রেসক্রিপশন সেভ করা
            try {
                await db.collection('prescriptions').add({
                    uid: currentUser.uid,
                    text: text,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp() // সার্ভার টাইমস্ট্যাম্প
                });

                alert("✅ প্রিসক্রিপশনটি সফলভাবে জমা হয়েছে!");
                document.getElementById('prescriptionText').value = ""; // বক্স খালি করা
                
                // কোটা রিয়েল-টাইমে আপডেট করা
                checkTodayQuota();

            } catch (error) {
                console.error("Submission error:", error);
                alert("সংরক্ষণ করতে সমস্যা হয়েছে, আবার চেষ্টা করুন।");
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
