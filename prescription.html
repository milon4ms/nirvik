<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রেসক্রিপশন এন্ট্রি - নির্ভীক হোমিও</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
    
    <script src="assets/js/firebase-config.js"></script>

    <style>
        body { 
            font-family: 'SolaimanLipi', system-ui, sans-serif; 
            background-color: #f0fdf4; 
        }
        
        /* হেডার ও মেনুর কালার সমস্যা সমাধানের ফিক্স */
        #header-placeholder, nav {
            background-color: #065f46 !important; /* ডার্ক গ্রিন ব্যাকগ্রাউন্ড */
        }
        #header-placeholder a, #header-placeholder button, nav a {
            color: #ffffff !important; /* টেক্সট কালার সাদা */
            opacity: 1 !important;
        }
        #header-placeholder a:hover, nav a:hover {
            color: #a7f3d0 !important; /* হোভার কালার */
        }

        /* ইনপুট ফিল্ড ও বাটনের আধুনিক ডিজাইন ফিক্স */
        .input-group i {
            transition: color 0.2s;
        }
        .input-field:focus + i {
            color: #059669;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div id="header-placeholder"></div>

    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-6 bg-white p-8 sm:p-10 rounded-2xl shadow-xl border border-emerald-100/50">
            
            <div class="flex items-center justify-center gap-4 border-b border-gray-100 pb-4">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 text-2xl shadow-sm border border-emerald-100 animate-bounce flex-shrink-0">
                    🌿
                </div>
                <div class="text-left flex-grow">
                    <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight leading-none">প্রেসক্রিপশন এন্ট্রি</h2>
                    <p class="mt-1.5 text-xs text-gray-500">নির্ভীক হোমিওতে আপনাকে স্বাগতম</p>
                </div>
            </div>

            <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-3 text-center">
                <span class="text-sm font-semibold text-emerald-800">আজকের কোটা ব্যবহার: </span>
                <span id="quotaText" class="font-bold text-emerald-600">লোড হচ্ছে...</span>
            </div>

            <form class="space-y-5" id="prescriptionForm">
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">✍️ প্রেসক্রিপশন লিখুন বা পেস্ট করুন</label>
                    <div class="relative input-group">
                        <textarea id="prescriptionText" placeholder="আপনার প্রেসক্রিপশনটি এখানে লিখুন..." required rows="6"
                            class="input-field w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all duration-200 text-base disabled:bg-gray-100 disabled:cursor-not-allowed"></textarea>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" id="submitBtn" disabled
                        class="w-full flex justify-center items-center py-3.5 px-4 border border-transparent rounded-xl text-base font-bold text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-4 focus:ring-emerald-100 transition-all duration-200 shadow-md hover:shadow-lg transform hover:-translate-y-0.5 disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none">
                        <i class="fas fa-paper-plane mr-2"></i> সাবমিট করুন
                    </button>
                </div>
            </form>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        // ===== হেডার/ফুটার লোড ও স্টাইল ইনজেকশন =====
        $(function() {
            $('#header-placeholder').load('assets/header.html', function() {
                $('#header-placeholder').find('nav, div.bg-white, div.bg-emerald-600').css('background-color', '#065f46');
                $('#header-placeholder').find('a, button, span').css('color', '#ffffff');

                const btn = document.getElementById('mobile-menu-btn');
                const menu = document.getElementById('mobile-menu');
                if (btn && menu) {
                    btn.addEventListener('click', function() {
                        menu.classList.toggle('hidden');
                        btn.innerHTML = menu.classList.contains('hidden') 
                            ? '<i class="fas fa-bars"></i>' 
                            : '<i class="fas fa-times"></i>';
                    });
                }
            });
            $('#footer-placeholder').load('assets/footer.html');
        });

        // ===== ডাটাবেজ ও কোটা সেন্সরশিপ লজিক =====
        const db = firebase.firestore();
        let currentUser = null;
        let userRole = "general";
        let maxQuota = 5;

        // আজকের তারিখের শুরু (রাত ১২:০০) এবং শেষ (রাত ১১:৫৯) সময় বের করার ফাংশন
        function getTodayRange() {
            const start = new Date();
            start.setHours(0, 0, 0, 0);

            const end = new Date();
            end.setHours(23, 59, 59, 999);

            return { start, end };
        }

        // ইউজারের লগইন স্টেট এবং রোল চেক করা
        firebase.auth().onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                try {
                    // ১. ফায়ারস্টোর থেকে ইউজারের Role (general নাকি paid) চেক করা
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        userRole = userDoc.data().role || "general";
                    }

                    // রোল অনুযায়ী সর্বোচ্চ লিমিট সেট
                    maxQuota = (userRole === "paid") ? 50 : 5;
                    
                    // ২. আজকে কয়টি প্রেসক্রিপশন জমা হয়েছে তা কাউন্ট করা
                    checkTodayQuota();

                } catch (error) {
                    console.error("Error fetching user data:", error);
                }
            } else {
                // রেজিস্টার্ড ইউজার না হলে লগইন পেজে রিডাইরেক্ট
                alert("এই পেজে প্রবেশ করতে প্রথমে লগইন করুন।");
                window.location.href = "login.html";
            }
        });

        // আজকের কোটা যাচাই ও ইনপুট বক্স লক/আনলক করার ফাংশন
        async function checkTodayQuota() {
            if (!currentUser) return;

            const { start, end } = getTodayRange();

            try {
                // আজকের ডেট রেঞ্জের প্রেসক্রিপশন কুয়েরি
                const snapshot = await db.collection('prescriptions')
                    .where('uid', '==', currentUser.uid)
                    .where('createdAt', '>=', start)
                    .where('createdAt', '<=', end)
                    .get();

                const submittedCount = snapshot.size; // আজকে যতগুলো জমা হয়েছে

                // UI-এর 'আজকের কোটা ব্যবহার' টেক্সট আপডেট
                const quotaDisplay = document.getElementById('quotaText');
                if (quotaDisplay) {
                    quotaDisplay.innerText = `${submittedCount} / ${maxQuota}`;
                }

                // ৩. কোটা পূর্ণ হলে বক্স ও বাটন লক করার লজিক
                const inputField = document.getElementById('prescriptionText');
                const submitBtn = document.getElementById('submitBtn');

                if (submittedCount >= maxQuota) {
                    if (inputField) {
                        inputField.disabled = true;
                        inputField.placeholder = `❌ আপনার আজকের দৈনিক কোটা (${maxQuota}টি) শেষ হয়ে গেছে। আগামীকাল আবার চেষ্টা করুন।`;
                    }
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.innerText = "আজকের কোটা শেষ";
                    }
                } else {
                    if (inputField) {
                        inputField.disabled = false;
                        inputField.placeholder = "আপনার প্রেসক্রিপশনটি এখানে লিখুন...";
                    }
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> সাবমিট করুন';
                    }
                }

            } catch (error) {
                console.error("Quota check error:", error);
            }
        }

        // ফর্ম সাবমিট হ্যান্ডলার
        document.getElementById('prescriptionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!currentUser) return;
            
            const inputField = document.getElementById('prescriptionText');
            const text = inputField ? inputField.value.trim() : "";
            const btn = document.getElementById('submitBtn');

            if (!text) {
                alert("অনুগ্রহ করে কিছু লিখুন!");
                return;
            }

            // সাবমিট করার আগে ডাবল সিকিউরিটি চেক করা
            if (btn) {
                btn.disabled = true;
                btn.innerText = "যাচাই করা হচ্ছে...";
            }

            const { start, end } = getTodayRange();
            const snapshot = await db.collection('prescriptions')
                .where('uid', '==', currentUser.uid)
                .where('createdAt', '>=', start)
                .where('createdAt', '<=', end)
                .get();

            if (snapshot.size >= maxQuota) {
                alert(`❌ আপনার আজকের কোটা (${maxQuota}টি) শেষ হয়ে গেছে!`);
                checkTodayQuota();
                return;
            }

            // ৪. ডাটাবেজে প্রেসক্রিপশন সেভ করা
            try {
                await db.collection('prescriptions').add({
                    uid: currentUser.uid,
                    text: text,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp() // সার্ভার টাইমস্ট্যাম্প
                });

                alert("✅ প্রিসক্রিপশনটি সফলভাবে জমা হয়েছে!");
                if (inputField) inputField.value = ""; // বক্স খালি করা
                
                // রিয়েল-টাইমে কোটা আপডেট
                checkTodayQuota();

            } catch (error) {
                console.error("Submission error:", error);
                alert("সংরক্ষণ করতে সমস্যা হয়েছে, আবার চেষ্টা করুন।");
                if (btn) btn.disabled = false;
            }
        });
    </script>

</body>
</html>
