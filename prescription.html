<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>প্রেসক্রিপশন সিস্টেম</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
    <style>
        body { font-family: 'SolaimanLipi', sans-serif; }
        .section-title { color: #065f46; font-weight: 700; font-size: 12px; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; margin-bottom: 6px; margin-top: 8px; }
        .section-content { font-size: 11px; color: #1f2937; line-height: 1.6; padding-left: 4px; }
        .rx-header { font-size: 2rem; font-weight: 900; color: #065f46; font-family: serif; font-style: italic; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div id="textModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg w-full max-w-2xl">
        <h2 class="text-lg font-bold mb-4" id="modalPatientSubtitle">প্রেসক্রিপশন এডিট ও প্রিন্ট</h2>
        <input type="hidden" id="editDocId">
        <textarea id="modalTextContent" class="w-full h-80 border p-2 rounded" placeholder="রোগীর নাম, ঠিকানা, বয়স, ফোন, তারিখ এবং ওষুধগুলো এখানে পেস্ট করুন..."></textarea>
        <div class="mt-4 flex gap-2">
            <button onclick="parseAndPrint()" class="bg-emerald-600 text-white px-4 py-2 rounded">প্রিন্ট প্রিভিউ</button>
            <button onclick="saveUpdatedPrescription()" class="bg-blue-600 text-white px-4 py-2 rounded">ডাটাবেজে সেভ</button>
            <button onclick="closeModal()" class="bg-gray-400 text-white px-4 py-2 rounded">বন্ধ</button>
        </div>
    </div>
</div>

<script>
    // নতুন লজিক: টেক্সট থেকে ডাটা আলাদা করা
    function parseAndPrint() {
        const fullText = $('#modalTextContent').val();
        const getVal = (regex) => (fullText.match(regex) || [])[1] || "";
        
        const data = {
            name: getVal(/রোগীর নাম:\s*(.*)/),
            address: getVal(/ঠিকানা:\s*(.*)/),
            age: getVal(/বয়স:\s*(.*)/),
            phone: getVal(/ফোন নম্বর:\s*(.*)/),
            date: getVal(/তারিখ:\s*(.*)/),
            sections: {
                mainMedicine: getVal(/১\. প্রধান হোমিওপ্যাথিক ঔষধ:([\s\S]*?)(?=\d\.)/),
                supportiveMedicine: getVal(/২\. সহায়ক ঔষধ:([\s\S]*?)(?=\d\.)/),
                biochemical: getVal(/৩\. বায়োকেমিক:([\s\S]*?)(?=\d\.)/),
                advice: getVal(/৪\. পরামর্শ:([\s\S]*?)(?=\d\.)/),
                symptoms: getVal(/৫\. রোগ লক্ষণ সমূহ:([\s\S]*?)(?=\d\.)/),
                diseaseName: getVal(/৬\. রোগের সম্ভাব্য নাম:([\s\S]*?)(?=\d\.)/),
                alternativeMedicine: getVal(/৭\. বিকল্প ঔষধ সমূহের তালিকা:([\s\S]*?)(?=\d\.|সতর্কতা:)/)
            }
        };
        printPrescriptionWindow(data);
    }

    function printPrescriptionWindow(d) {
        const printWindow = window.open('', '_blank', 'width=950,height=1000');
        printWindow.document.write(`
            <html><head><script src="https://cdn.tailwindcss.com"><\/script>
            <style>body{font-family: 'SolaimanLipi', sans-serif; background:white; padding:20px;} .section-title{color:#065f46; font-weight:700; font-size:12px; border-bottom:1px solid #ddd; margin-top:8px;} .section-content{font-size:11px; line-height:1.6;} .rx-header{font-size:2rem; color:#065f46; font-style:italic;}</style></head>
            <body class="p-8">
                <div class="max-w-4xl mx-auto border p-8 shadow-sm">
                    <div class="grid grid-cols-4 gap-2 bg-slate-50 p-3 mb-6 border text-xs">
                        <div>নাম: <b>${d.name}</b></div>
                        <div>ঠিকানা: <b>${d.address}</b></div>
                        <div>বয়স: <b>${d.age}</b></div>
                        <div>ফোন: <b>${d.phone}</b></div>
                    </div>
                    <div class="grid grid-cols-12 gap-6">
                        <div class="col-span-4 border-r pr-4">
                            <div class="section-title">৫. রোগ লক্ষণ সমূহ</div><div class="section-content">${d.sections.symptoms.replace(/\n/g, '<br>')}</div>
                            <div class="section-title">৬. রোগের সম্ভাব্য নাম</div><div class="section-content">${d.sections.diseaseName.replace(/\n/g, '<br>')}</div>
                            <div class="section-title">৭. বিকল্প ঔষধ সমূহের তালিকা</div><div class="section-content">${d.sections.alternativeMedicine.replace(/\n/g, '<br>')}</div>
                        </div>
                        <div class="col-span-8">
                            <div class="rx-header">R<sub>x</sub></div>
                            <div class="section-title">১. প্রধান হোমিওপ্যাথিক ঔষধ</div><div class="section-content">${d.sections.mainMedicine.replace(/\n/g, '<br>')}</div>
                            <div class="section-title">২. সহায়ক ঔষধ</div><div class="section-content">${d.sections.supportiveMedicine.replace(/\n/g, '<br>')}</div>
                            <div class="section-title">৩. বায়োকেমিক</div><div class="section-content">${d.sections.biochemical.replace(/\n/g, '<br>')}</div>
                            <div class="section-title">৪. পরামর্শ</div><div class="section-content">${d.sections.advice.replace(/\n/g, '<br>')}</div>
                        </div>
                    </div>
                    <button onclick="window.print()" class="no-print mt-6 bg-emerald-600 text-white px-4 py-2 rounded">প্রিন্ট করুন</button>
                </div>
            </body></html>
        `);
        printWindow.document.close();
    }
    
    // আপনার পূর্বের ফাংশনগুলো এখানে যথারীতি থাকবে...
    function closeModal() { $('#textModal').removeClass('flex').addClass('hidden'); }
    function saveUpdatedPrescription() { /* আপনার আগের কোড */ }
</script>
</body>
</html>
