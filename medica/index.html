            ]
        };

        const alphabetGrid = document.getElementById('alphabet-grid');
        const contentArea = document.getElementById('medicine-content');
        const startChar = 'A'.charCodeAt(0);
        const endChar = 'Z'.charCodeAt(0);

        // নির্দিষ্ট অক্ষরের লিংক ডিরেক্টরি দেখানোর ফাংশন
        function showMedicines(letter) {
            document.querySelectorAll('#alphabet-grid button').forEach(btn => {
                btn.classList.remove('bg-teal-600', 'text-white');
                btn.classList.add('bg-teal-50', 'text-teal-700');
            });
            const activeBtn = document.getElementById(`btn-${letter}`);
            if(activeBtn) {
                activeBtn.classList.remove('bg-teal-50', 'text-teal-700');
                activeBtn.classList.add('bg-teal-600', 'text-white');
            }

            const medicines = medicineData[letter] || [];
            if (medicines.length === 0) {
                contentArea.innerHTML = `<p class="text-gray-400 text-center py-10">"${letter}" ক্যাটাগরিতে কোনো ফাইল বা লিংক নেই।</p>`;
                return;
            }

            let html = `
                <div class="border-b border-gray-100 pb-2 mb-3 flex items-center justify-between">
                    <h3 class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                        <i class="fas fa-folder-open text-amber-500"></i> সূচীপত্র — "${letter}"
                    </h3>
                    <span class="bg-slate-100 text-slate-700 text-[10px] px-2 py-0.5 rounded-md font-medium">${medicines.length}টি লিংক</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2">
            `;

            medicines.forEach(med => {
                html += `
                    <a href="${med.file}" class="p-2 bg-gray-50 hover:bg-teal-50 border border-gray-200 hover:border-teal-300 rounded-xl flex items-center gap-2 transition text-gray-700 hover:text-teal-700 font-medium text-[11px] group shadow-sm">
                        <i class="fas fa-link text-gray-400 group-hover:text-teal-500 text-[9px] transition-colors"></i>
                        <span class="truncate">${med.name}</span>
                    </a>
                `;
            });

            html += `</div>`;
            contentArea.innerHTML = html;
        }

        // A থেকে Z বাটন গ্রিড রেন্ডারিং
        for (let i = startChar; i <= endChar; i++) {
            const letter = String.fromCharCode(i);
            const button = document.createElement('button');
            button.id = `btn-${letter}`;
            button.className = "w-7 h-7 flex items-center justify-center font-bold text-teal-700 bg-teal-50 border border-teal-200 rounded-lg shadow-sm hover:bg-teal-600 hover:text-white transition-all text-[11px]";
            button.textContent = letter;
            
            button.addEventListener('click', () => showMedicines(letter));
            alphabetGrid.appendChild(button);
        }

        // শুরুতে ডিফল্টভাবে 'A' লোড হবে
        document.addEventListener('DOMContentLoaded', () => {
            showMedicines('A');
        });
