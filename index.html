<!DOCTYPE html>
<html>
<head>
<style>
  /* AI Container Design */
  .ai-section {
    display: flex;
    align-items: center;
    gap: 15px;
    background: #f8f9fa; /* ব্যাকগ্রাউন্ড কালার */
    padding: 20px;
    border-radius: 10px;
    font-family: sans-serif;
  }

  .ai-label {
    font-weight: bold;
    color: #333;
    font-size: 16px;
    margin-right: 10px;
  }

  .ai-item {
    display: flex;
    align-items: center;
    gap: 8px; /* আইকন ও টেক্সটের মাঝখানের ফাঁক */
    text-decoration: none; /* লিংকের আন্ডারলাইন সরাবে */
    background: white;
    padding: 6px 12px 6px 6px;
    border-radius: 50px; /* গোলাকার বাটন */
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    transition: 0.3s;
    border: 1px solid #eee;
    color: #333; /* টেক্সটের রং */
    font-size: 14px;
  }

  .ai-item:hover {
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transform: translateY(-2px);
  }

  /* Icon Design */
  .ai-icon {
    width: 24px;  /* আইকন ছোট করা হয়েছে */
    height: 24px;
    object-fit: contain;
    border-radius: 50%; /* যদি আইকন গোলাকার হয় */
  }
</style>
</head>
<body>

<!-- আপনার এই সেকশনটি এখানে বসাবে -->
<div class="ai-section">
  <span class="ai-label">AI সহায়তা</span>

  <!-- জেমিনি -->
  <a href="https://gemini.google.com/" target="_blank" class="ai-item">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Google_Gemini_logo.svg/1200px-Google_Gemini_logo.svg.png" class="ai-icon" alt="Gemini">
    <span>Gemini</span>
  </a>

  <!-- চ্যাটজিপিটি -->
  <a href="https://chat.openai.com/" target="_blank" class="ai-item">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/ChatGPT_logo.svg/1200px-ChatGPT_logo.svg.png" class="ai-icon" alt="ChatGPT">
    <span>ChatGPT</span>
  </a>

  <!-- অন্য এআই (পিডিএফ আইকন এর জায়গায় আপনি ছবি বসাবেন) -->
  <a href="https://www.perplexity.ai/" target="_blank" class="ai-item">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Perplexity_AI_logo.svg/1200px-Perplexity_AI_logo.svg.png" class="ai-icon" alt="AI Tool">
    <span>Perplexity</span> <!-- নাম বসান -->
  </a>
  
  <!-- আপনার মত একই আইকন স্টাইলে আরেকটি -->
  <a href="https://claude.ai/" target="_blank" class="ai-item">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Claude_AI_logo.svg/1200px-Claude_AI_logo.svg.png" class="ai-icon" alt="Claude">
    <span>Claude</span>
  </a>

</div>

</body>
</html>
