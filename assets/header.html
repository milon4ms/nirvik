.tools{max-width:1080px;margin:16px auto 0;padding:0 16px;display:flex;justify-content:flex-end;gap:8px}
.tool-btn{border:1px solid var(--line);background:#fff;padding:6px 13px;border-radius:999px;font-weight:600;font-size:.84rem;cursor:pointer;color:var(--text)}

.sections-grid{max-width:1080px;margin:14px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.section-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:.2s}
.section-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,23,42,.1)}

.section-head{width:100%;border:none;background:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px;text-align:left;border-top:4px solid var(--accent)}
.sec-icon{width:48px;height:48px;min-width:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:var(--accent-soft)}
.sec-info{flex:1;min-width:0}
.sec-info h2{font-size:1.08rem;line-height:1.35}
.sec-meta{font-size:.82rem;color:var(--muted);margin-top:2px}
.sec-meta b{color:var(--accent)}
.chev{width:30px;height:30px;min-width:30px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:transform .25s;font-size:.8rem}
.section-card.active{border-color:var(--accent);box-shadow:0 8px 24px rgba(15,23,42,.12)}
.section-card.active .chev{transform:rotate(180deg);background:var(--accent);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.tags-panel{max-width:1080px;margin:18px auto 0;padding:0 16px;display:none}
.tags-panel.show{display:block;animation:fadeIn .25s ease}
.panel-head{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px 14px 0 0;padding:14px 16px;border-bottom:none}
.panel-head h2{font-size:1.12rem}
.panel-head p{font-size:.84rem;color:var(--muted);margin-top:1px}
.panel-head p b{color:var(--accent)}
.panel-close{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:.85rem;color:var(--muted)}
.panel-close:hover{background:#fee2e2;color:#dc2626;border-color:#fecaca}
.tags-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;background:#fff;border:1px solid var(--line);border-radius:0 0 14px 14px;padding:16px;box-shadow:var(--shadow)}
.tag-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;color:var(--text);transition:.2s;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center}

.tag-en{color:var(--muted);font-size:.76rem;line-height:1.4}

// দেখানোর ক্রম: উপরে ৩টি — উপরের / মাঝের / নিচের অঙ্গ, নিচে ৩টি — বাকি ৩টি
const DISPLAY_ORDER = ["উপরের অঙ্গ", "মাঝের অঙ্গ", "নিচের অঙ্গ", "মানসিক ও স্বভাবগত", "সার্বদৌহিক", "বিবিধ"];
const META = {
  "উপরের অঙ্গ": {icon:"🧠", accent:"#4361ee", soft:"#eef2ff"},
  "মাঝের অঙ্গ": {icon:"🫁", accent:"#059669", soft:"#ecfdf5"},
  "নিচের অঙ্গ": {icon:"🦵", accent:"#ea580c", soft:"#fff7ed"},
  "মানসিক ও স্বভাবগত": {icon:"🧘", accent:"#7c3aed", soft:"#f5f3ff"},
  "সার্বদৌহিক": {icon:"🌡️", accent:"#dc2626", soft:"#fef2f2"},
  "বিবিধ": {icon:"✨", accent:"#0891b2", soft:"#ecfeff"}
};
const bn = n => n.toLocaleString('bn-BD');

function tagHTML(sym) {
  const href = `play.html?type=sym&id=${encodeURIComponent(sym.base)}`;
  return `<a href="${href}" class="tag-card" target="_blank" data-file="${sym.file}">
    <span class="tag-bn">${sym.bn}</span>
    <span class="tag-en">${sym.en}</span>
    <span class="tag-count">${bn(sym.count)}টি প্রশ্ন</span>
  </a>`;
}

function build() {
  const grid = document.getElementById('sectionsGrid');
  const panel = document.getElementById('tagsPanel');
  const panelIcon = document.getElementById('panelIcon');
  const panelTitle = document.getElementById('panelTitle');
  const panelMeta = document.getElementById('panelMeta');
  const tagsGrid = document.getElementById('tagsGrid');
  let activeSec = null;

  grid.innerHTML = DISPLAY_ORDER.map(sec => {
    const list = symptomsList.filter(s => s.section === sec);
    const totalQ = list.reduce((a,s) => a + s.count, 0);
    const m = META[sec];
    return `<article class="section-card" data-section="${sec}" style="--accent:${m.accent};--accent-soft:${m.soft}">
      <button class="section-head" aria-expanded="false">
        <span class="sec-icon">${m.icon}</span>
        <span class="sec-info"><h2>${sec}</h2><div class="sec-meta"><b>${bn(list.length)}টি ট্যাগ</b> &nbsp;•&nbsp; ${bn(totalQ)}টি প্রশ্ন</div></span>
        <span class="chev"><i class="fa-solid fa-chevron-down"></i></span>
      </button>
    </article>`;
  }).join('');

  function openSection(sec, scroll = true) {
    const list = symptomsList.filter(s => s.section === sec);
    const totalQ = list.reduce((a,s) => a + s.count, 0);
    const m = META[sec];
    activeSec = sec;
    grid.querySelectorAll('.section-card').forEach(c => {
      const isActive = c.dataset.section === sec;
      c.classList.toggle('active', isActive);
      c.querySelector('.section-head').setAttribute('aria-expanded', isActive ? 'true' : 'false');
    });
    panelIcon.textContent = m.icon;
    panelIcon.style.background = m.soft;
    panelTitle.textContent = sec;
    panelTitle.style.color = m.accent;
    panelMeta.innerHTML = `<b>${bn(list.length)}টি ট্যাগ</b> &nbsp;•&nbsp; ${bn(totalQ)}টি প্রশ্ন — সব ট্যাগ একসাথে দেখা যাচ্ছে`;
    tagsGrid.innerHTML = list.map(s => tagHTML(s)).join('');
    panel.classList.add('show');
    if (scroll) panel.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  }

  function closePanel() {
    activeSec = null;
    panel.classList.remove('show');
    grid.querySelectorAll('.section-card').forEach(c => {
      c.classList.remove('active');
      c.querySelector('.section-head').setAttribute('aria-expanded', 'false');
    });
  }

  grid.querySelectorAll('.section-head').forEach(head => {
    head.addEventListener('click', () => {
      const sec = head.closest('.section-card').dataset.section;
      if (activeSec === sec) closePanel();
      else openSection(sec);
    });
  });

  document.getElementById('panelClose').onclick = closePanel;

  // প্রথমে উপরের অঙ্গ খোলা থাকবে — সব ট্যাগ একসাথে দেখা যাবে (লোডে স্ক্রল হবে না)
  openSection(DISPLAY_ORDER[0], false);
}
build();
</script>
</body>
</html>
